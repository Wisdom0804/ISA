# -*- coding: utf-8 -*-
# 文件名：retrieval.toml
# 文件描述: 召回通道、RRF 融合、精排模式与候选配额等检索默认值
# 作者: 郑智文
# 创建日期: 2026-11-19
# 版本: 1.0
# IDE: PyCharm

# 检索默认值。实际生效值随运行封存到 retrieval_config_snapshot，不以本文件替代运行记录。
# RerankMode 默认 cross_encoder；disabled 仅用于显式实验或配置降级，并记录事件。

[channels]
# dense、bm25、fuzzy 的启停状态；fuzzy 是独立候选通道，参与 RRF 融合。

[fusion]
# RRF 常数 rrf_k 与各通道权重；并列按固定 ID 打破。

[rerank]
# mode: cross_encoder 或 disabled；disabled 仅用于显式实验或配置降级，并记录原因与事件。

[limits]
# 各通道候选配额、进入精排的数量与向量通道上限。

[bm25]
# k1、b、分词器与词典版本。
